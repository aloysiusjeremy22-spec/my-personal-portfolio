<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aloysius · Interactive Laptop Portfolio</title>
<meta name="description" content="Interactive laptop-style portfolio of Aloysius, a Computer Science student. Open the laptop to explore projects, certificates, resume and contact info.">
<meta name="theme-color" content="#183D32">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/laptop.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/applications.css">
<link rel="stylesheet" href="css/guide.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<main class="scene">
  <div class="stage" id="laptop" data-state="closed">
    <div class="hero" id="hero">
      <h1>Welcome to Aloysius's Portfolio</h1>
      <p>Click to explore my portfolio.</p>
      <button class="btn" id="openBtn" type="button">OPEN LAPTOP</button>
    </div>
    <div class="laptop">
      <div class="lid">
        <div class="lid-face lid-screen">
          <div class="screen" id="screen">
            <div class="boot" id="boot"><div class="boot-logo">A</div><div class="boot-bar"><i></i></div></div>
            <div class="desktop" id="desktop" hidden>
              <div class="wallpaper"><div class="greet"><h2>Welcome to Aloysius's Digital Workspace.</h2><p id="dateText"></p></div></div>
              <div class="icons" id="icons"></div>
              <div class="windows" id="windows"></div>
              <div class="taskbar">
                <button class="tb-start" id="startBtn" type="button" aria-label="Start menu" aria-haspopup="true">⊞</button>
                <button class="tb-close" id="closeBtn" type="button" aria-label="Close laptop">CLOSE LAPTOP</button>
                <div class="tb-apps" id="tbApps"></div>
                <div class="tray"><button class="tb-btn" id="volBtn" type="button" aria-label="Volume">🔊</button><button class="tb-btn" id="pwrBtn" type="button" aria-label="Power menu" aria-haspopup="true">⏻</button></div>
                <time class="clock" id="clock"></time>
              </div>
              <div class="menu" id="startMenu" hidden></div><div class="menu" id="pwrMenu" hidden></div><div class="menu" id="volMenu" hidden></div>
              <div class="shutdown" id="shutdown" aria-live="polite"><div class="boot-logo">A</div><p id="shutMsg">Shutting down…</p><div class="spin"></div></div>
            </div>
          </div>
        </div>
        <div class="lid-face lid-outer"><span class="lid-logo">Aloysius</span></div>
      </div>
      <div class="base"><div class="keys"></div><div class="pad"></div></div>
    </div>
    <div class="floor-shadow"></div>
  </div>
  <aside class="note" id="guide" aria-label="Portfolio guide"></aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script src="js/config.js"></script>
<script src="js/script.js"></script>
<script src="js/window-manager.js"></script>
<script src="js/contact.js"></script>
<script src="js/file-explorer.js"></script>
<script src="js/chrome.js"></script>
<script src="js/spotify.js"></script>
<script src="js/gallery.js"></script>
<script src="js/settings.js"></script>
<script src="js/about.js"></script>
<script src="js/desktop.js"></script>
<script src="js/laptop.js"></script>
<script src="js/guide.js"></script>
</body>
</html>
